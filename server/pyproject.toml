[project]
name = "tts-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

